<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عجلة الهدايا | Handsome &amp; Pretty</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f2fb;--card:#fff;--ink:#2b2f34;--muted:#6d7078;--accent:#9b5fc9;--deep:#5b3a80;--line:#e6d9f2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16131b;--card:#221e29;--ink:#f2eef6;--muted:#a9a3b4;--accent:#c18ae8;--deep:#d9bdef;--line:#3a3345}}
:root[data-theme="dark"]{--bg:#16131b;--card:#221e29;--ink:#f2eef6;--muted:#a9a3b4;--accent:#c18ae8;--deep:#d9bdef;--line:#3a3345}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,"Segoe UI",Tahoma,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:22px 18px 40px;text-align:center}
.logo{direction:ltr;font-size:clamp(30px,9vw,42px);font-weight:700;letter-spacing:-.5px;line-height:1.1}
.logo span{color:var(--accent)}
.sub{direction:ltr;font-size:11px;letter-spacing:.45em;color:var(--muted);margin-top:4px;padding-left:.45em}
h1{font-size:clamp(24px,7vw,32px);font-weight:900;margin:26px 0 6px}
.lead{color:var(--muted);margin:0 auto 26px;max-width:34ch;line-height:1.7}
.stage{position:relative;width:min(88vw,440px);aspect-ratio:1;margin:0 auto}
.stage::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:conic-gradient(from 0deg,var(--accent),var(--line),var(--accent),var(--line),var(--accent));opacity:.55}
canvas{position:relative;width:100%;height:100%;border-radius:50%;display:block;transition:transform 5.6s cubic-bezier(.12,.62,.08,1);box-shadow:0 14px 40px rgba(91,58,128,.28)}
.pointer{position:absolute;top:-16px;left:50%;transform:translateX(-50%);z-index:3;width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:32px solid var(--deep);filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.hub{position:absolute;z-index:2;top:50%;left:50%;transform:translate(-50%,-50%);width:26%;aspect-ratio:1;border-radius:50%;border:5px solid #fff;background:var(--deep);color:#fff;font:900 clamp(16px,5vw,22px) Cairo,sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.hub:hover:not(:disabled){background:var(--accent)}
.hub:disabled{cursor:default;opacity:.85}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#hint{margin:26px 0 0;color:var(--muted);font-weight:500}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(20,14,28,.62);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet[hidden]{display:none}
.card{width:100%;max-width:440px;background:var(--card);border-radius:24px;padding:26px 22px 22px;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:up .45s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.card h2{margin:0;font-size:28px;font-weight:900;color:var(--deep)}
.prize{margin:10px 0 16px;font-size:21px;font-weight:700;line-height:1.5}
.code{display:inline-block;direction:ltr;border:2px dashed var(--accent);border-radius:12px;padding:6px 18px;font:700 22px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.14em;color:var(--deep)}
.card label{display:block;text-align:right;font-size:14px;color:var(--muted);margin:18px 0 6px}
.card input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:500 16px Cairo,sans-serif}
.wa{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;padding:14px;border-radius:14px;background:#1fa855;color:#fff;font-weight:900;font-size:18px;text-decoration:none}
.wa:hover{background:#188a45}
.note{margin:14px 0 0;font-size:13px;color:var(--muted);line-height:1.7}
.c{position:fixed;top:-16px;width:9px;height:15px;z-index:20;pointer-events:none;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){canvas{transition-duration:.01s}.card{animation:none}}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:26px auto 0;max-width:440px}
.slot{font:inherit;color:var(--ink);background:var(--card);border:1.5px dashed var(--line);border-radius:16px;padding:10px 6px;min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:default}
.slot small{font-size:12px;color:var(--muted)}
.slot b{font-size:15px;line-height:1.3;font-weight:700}
.slot.on{border-style:solid;border-color:var(--accent)}
.slot:not(:disabled){cursor:pointer;box-shadow:0 0 0 3px var(--line)}
.slot:not(:disabled):hover{border-color:var(--deep)}
.slot.won{background:var(--accent);border-color:var(--accent);color:#fff}
.slot.won small{color:#fff}
.slot.dim{opacity:.45}
.steps{text-align:right;margin:16px 0 0;padding:0 20px 0 0;line-height:1.9;font-size:15px}
.when{margin:8px 0 0;font-size:13px;color:var(--muted)}
.back{margin-top:10px;width:100%;padding:11px;border:0;background:transparent;color:var(--muted);font:500 15px Cairo,sans-serif;cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="logo">Handsome <span>&amp;</span> Pretty</div>
  <div class="sub">MEDICAL CENTER</div>
  <h1>أدِر العجلة واربح هديتك</h1>
  <p class="lead">لديك 3 محاولات. أدِر العجلة، ثم اختر الهدية التي تعجبك وأرسلها لنا على واتساب.</p>
  <div class="stage">
    <div class="pointer"></div>
    <canvas id="w" width="900" height="900" role="img" aria-label="عجلة الهدايا"></canvas>
    <button class="hub" id="spin" type="button">أدِر</button>
  </div>
  <div class="slots" id="slots"></div>
  <p id="hint"></p>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="t">
    <h2 id="t">هديتك المختارة 🎉</h2>
    <div class="prize" id="prize"></div>
    <div class="code" id="code"></div>
    <div class="when" id="when"></div>
    
    <label for="nm">اسمك (اختياري)</label>
    <input id="nm" type="text" autocomplete="name" placeholder="اكتب اسمك ليظهر في الرسالة">
    <a class="wa" id="wa" href="#" target="_blank" rel="noopener">أرسل هديتي على واتساب</a>
    <button class="back" id="back" type="button">رجوع لاختيار هدية أخرى</button>
    <p class="note">سيتواصل معك فريق الحجز لتأكيد الموعد وتفعيل العرض. هدية واحدة لكل عميل.</p>
  </div>
</div>

<script>
// ===== Edit here =====
const WA_NUMBER = "97124433221"; // WhatsApp number with country code, digits only, e.g. "9715XXXXXXXX"
const PRIZES = [
  {l:["خصم 10%"],            full:"خصم 10% على جلستك القادمة",              w:22, bg:"#7b4fa3", fg:"#ffffff"},
  {l:["جلسة إضافية","مجانًا"],  full:"جلسة إضافية مجانًا مع باقتك",            w:10, bg:"#e6d3f4", fg:"#2b2f34"},
  {l:["ليزر الإبط","أو اللحية"], full:"عرض خاص على ليزر الإبط أو اللحية",       w:12, bg:"#3a3f45", fg:"#ffffff"},
  {l:["هدية","مفاجأة"],        full:"هدية مفاجأة من مركزنا",                  w:6,  bg:"#c18ae8", fg:"#2b2f34"},
  {l:["احجزوا معًا","ووفّروا"],  full:"احجزوا مع صديق ووفّروا معًا",           w:20, bg:"#f3e9fb", fg:"#2b2f34"},
  {l:["خصم 15%"],            full:"خصم 15% على جلستك القادمة",              w:12, bg:"#9b5fc9", fg:"#ffffff"},
  {l:["هيدرافيشل","أو أوكسجين"], full:"عرض خاص على الهيدرافيشل أو فيشل الأكسجين", w:12, bg:"#2b2f34", fg:"#ffffff"}
];
// =====================
const KEY="hp_wheel_v2", TEST=location.hash==="#test", MAX=3;
const cv=document.getElementById("w"), ctx=cv.getContext("2d"), n=PRIZES.length, seg=360/n;
const spinBtn=document.getElementById("spin"), hint=document.getElementById("hint"), slotsEl=document.getElementById("slots");

function draw(){
  const S=cv.width,c=S/2,R=c-8;
  ctx.clearRect(0,0,S,S);
  PRIZES.forEach((p,i)=>{
    const a0=-Math.PI/2+i*seg*Math.PI/180,a1=a0+seg*Math.PI/180;
    ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,R,a0,a1);ctx.closePath();
    ctx.fillStyle=p.bg;ctx.fill();
    ctx.strokeStyle="#ffffff";ctx.lineWidth=4;ctx.stroke();
    ctx.save();ctx.translate(c,c);ctx.rotate((a0+a1)/2);
    ctx.fillStyle=p.fg;ctx.direction="rtl";ctx.textAlign="right";ctx.textBaseline="middle";
    const fs=p.l.length>1?40:46;ctx.font="700 "+fs+"px Cairo, sans-serif";
    p.l.forEach((t,k)=>ctx.fillText(t,R-34,(k-(p.l.length-1)/2)*(fs+6)));
    ctx.restore();
  });
  ctx.beginPath();ctx.arc(c,c,R,0,7);ctx.lineWidth=10;ctx.strokeStyle="#ffffff";ctx.stroke();
}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(draw);draw();

let state={spins:[],chosen:-1}, rot=0, busy=false;
function save(){if(TEST)return;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function load(){if(TEST)return;try{const o=JSON.parse(localStorage.getItem(KEY)||"null");if(o&&Array.isArray(o.spins))state=o}catch(e){}}

function pick(){
  const used=state.spins.map(s=>s.i);
  const pool=PRIZES.map((p,i)=>({i,w:p.w})).filter(x=>!used.includes(x.i));
  let r=Math.random()*pool.reduce((t,x)=>t+x.w,0);
  for(const x of pool){r-=x.w;if(r<0)return x.i}return pool[0].i;
}
function mkCode(){
  const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";
  for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];
  return "HP-"+s;
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cols=["#9b5fc9","#c18ae8","#e6d3f4","#ffffff","#3a3f45"];
  for(let i=0;i<45;i++){
    const d=document.createElement("div");d.className="c";
    d.style.left=Math.random()*100+"vw";d.style.background=cols[i%cols.length];
    d.style.animationDelay=Math.random()*.6+"s";d.style.animationDuration=2.2+Math.random()*1.4+"s";
    document.body.appendChild(d);setTimeout(()=>d.remove(),4500);
  }
}

for(let k=0;k<MAX;k++){
  const b=document.createElement("button");b.type="button";b.className="slot";
  b.innerHTML="<small>المحاولة "+(k+1)+"</small><b>؟</b>";
  b.addEventListener("click",()=>openSheet(k));slotsEl.appendChild(b);
}
function render(){
  const left=MAX-state.spins.length,done=left===0;
  [...slotsEl.children].forEach((b,k)=>{
    const s=state.spins[k];
    b.querySelector("b").textContent=s?PRIZES[s.i].l.join(" "):"؟";
    b.classList.toggle("on",!!s);b.classList.toggle("won",state.chosen===k);
    b.classList.toggle("dim",state.chosen>=0&&state.chosen!==k);
    b.disabled=!(done&&(state.chosen<0||state.chosen===k));
  });
  spinBtn.disabled=busy||done;
  if(state.chosen>=0)hint.textContent="تم اختيار هديتك. اضغط عليها لإرسالها على واتساب";
  else if(done)hint.textContent="انتهت محاولاتك. اختر الهدية التي تريدها";
  else if(!state.spins.length)hint.textContent="اضغط الزر في المنتصف. لديك 3 محاولات";
  else hint.textContent="ربحت "+PRIZES[state.spins[state.spins.length-1].i].full+". المحاولات المتبقية: "+left;
}

const nm=document.getElementById("nm"),wa=document.getElementById("wa"),sheet=document.getElementById("sheet");
let cur=-1;
function link(){
  const s=state.spins[cur],p=PRIZES[s.i],name=nm.value.trim();
  const msg="مرحبًا Handsome & Pretty 👋\nاخترت من عجلة الهدايا: "+p.full+"\nكود الجائزة: "+s.code+(name?"\nالاسم: "+name:"")+"\nأرغب في حجز موعد للاستفادة من الهدية.";
  wa.href="https://wa.me/"+WA_NUMBER.replace(/\D/g,"")+"?text="+encodeURIComponent(msg);
}
function openSheet(k){
  cur=k;const s=state.spins[k];
  document.getElementById("prize").textContent=PRIZES[s.i].full;
  document.getElementById("code").textContent=s.code;
  document.getElementById("when").textContent=new Date(s.t).toLocaleString("ar-AE",{dateStyle:"medium",timeStyle:"short"});
  document.getElementById("back").hidden=state.chosen>=0;
  link();sheet.hidden=false;
}
nm.addEventListener("input",link);
wa.addEventListener("click",()=>{link();if(state.chosen<0){state.chosen=cur;save();render();document.getElementById("back").hidden=true}});
document.getElementById("back").addEventListener("click",()=>{sheet.hidden=true});
sheet.addEventListener("click",e=>{if(e.target===sheet)sheet.hidden=true});

function spin(){
  if(busy||state.spins.length>=MAX)return;
  busy=true;render();hint.textContent="حظ سعيد...";
  const i=pick(),jit=(Math.random()-.5)*seg*.7;
  const F=(((360-(i*seg+seg/2+jit))%360)+360)%360;
  rot+=360*6+((((F-rot)%360)+360)%360);
  cv.style.transform="rotate("+rot+"deg)";
  const wait=matchMedia("(prefers-reduced-motion: reduce)").matches?50:5800;
  setTimeout(()=>{
    state.spins.push({i,code:mkCode(),t:Date.now()});save();busy=false;confetti();render();
  },wait);
}
spinBtn.addEventListener("click",spin);

load();render();
if(state.chosen>=0&&state.spins[state.chosen])openSheet(state.chosen);
</script>
</body>
</html>
